# nRF Connect SDK v3.4.0 / Zephyr 4.4
# Minimal image-transfer firmware for nRF52811 + UC8179.

# Bluetooth Peripheral + GATT server only. The Central initiates ATT MTU exchange.
CONFIG_BT=y
CONFIG_BT_PERIPHERAL=y
CONFIG_BT_GATT_CLIENT=n
CONFIG_BT_SMP=n
CONFIG_BT_SETTINGS=n
CONFIG_BT_MAX_CONN=1
CONFIG_BT_DEVICE_NAME="NRF_EPD_3C1D"

# Fixed GATT database: no bonding/settings and no Service Changed machinery needed.
CONFIG_BT_GATT_SERVICE_CHANGED=n
CONFIG_BT_GATT_CACHING=n

# Use Zephyr's lower-memory controller instead of the default SoftDevice Controller.
# app.overlay enables bt_hci_controller and disables bt_hci_sdc.
CONFIG_BT_LL_SW_SPLIT=y

# Accept ATT MTU 247 so the existing protocol keeps a 244-byte GATT payload.
# RX_COUNT_EXTRA=1 is the minimum allowed with one connection and is required for
# L2CAP recombination. Keep the large RX buffer, but trim unrelated HCI event buffers.
CONFIG_BT_BUF_ACL_RX_SIZE=251
CONFIG_BT_BUF_ACL_RX_COUNT_EXTRA=1
CONFIG_BT_L2CAP_TX_MTU=247
CONFIG_BT_BUF_EVT_RX_COUNT=4

# E-paper hardware.
CONFIG_GPIO=y
CONFIG_SPI=y

# Footprint: no console/logging/security/settings, no MPU, minimal C library.
CONFIG_SIZE_OPTIMIZATIONS=y
CONFIG_MINIMAL_LIBC=y
CONFIG_ARM_MPU=n
CONFIG_LOG=n
CONFIG_CONSOLE=n
CONFIG_UART_CONSOLE=n
CONFIG_SERIAL=n
CONFIG_BOOT_BANNER=n
CONFIG_ASSERT=n
CONFIG_MAIN_STACK_SIZE=768
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=768
CONFIG_HEAP_MEM_POOL_SIZE=0

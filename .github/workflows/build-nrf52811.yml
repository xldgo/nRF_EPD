name: Build nRF52811 firmware

on:
  push:
    branches:
      - feature/bw-partial-image
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install ARM GCC 9.3.1
        run: |
          curl -fL --retry 3 \
            -o /tmp/gcc-arm-none-eabi.tar.bz2 \
            https://developer.arm.com/-/media/Files/downloads/gnu-rm/9-2020q2/gcc-arm-none-eabi-9-2020-q2-update-x86_64-linux.tar.bz2
          sudo tar -xjf /tmp/gcc-arm-none-eabi.tar.bz2 -C /usr/local
          /usr/local/gcc-arm-none-eabi-9-2020-q2-update/bin/arm-none-eabi-gcc --version

      - name: Build nRF52811 application
        run: make -f Makefile.nRF52 -j2

      - name: Show image size
        run: /usr/local/gcc-arm-none-eabi-9-2020-q2-update/bin/arm-none-eabi-size _build/nrf52811_xxaa.out

      - name: Upload application artifacts
        uses: actions/upload-artifact@v4
        with:
          name: bw-partial-app
          if-no-files-found: error
          path: |
            _build/nrf52811_xxaa.hex
            _build/nrf52811_xxaa.bin
            _build/nrf52811_xxaa.out
            _build/nrf52811_xxaa.map

      - name: Upload application HEX for OTA job
        uses: actions/upload-artifact@v4
        with:
          name: bw-partial-app-hex
          path: _build/nrf52811_xxaa.hex
          if-no-files-found: error

  package-ota:
    needs: build
    runs-on: windows-2025

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download application HEX
        uses: actions/download-artifact@v4
        with:
          name: bw-partial-app-hex
          path: _ci_hex

      - name: Build signed Secure DFU package
        shell: pwsh
        run: |
          $nrfutil = Resolve-Path .\tools\bin\nrfutil.exe
          $hex = Resolve-Path .\_ci_hex\nrf52811_xxaa.hex
          $key = Resolve-Path .\tools\priv.pem
          & $nrfutil pkg generate `
            --application $hex `
            --key-file $key `
            --hw-version 52 `
            --sd-req 0x126 `
            --sd-id 0x126 `
            --application-version 0x21 `
            .\nrf-epd-bw-partial-0x21-ota.zip
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Get-Item .\nrf-epd-bw-partial-0x21-ota.zip | Format-List Name,Length

      - name: Upload signed BLE DFU ZIP
        uses: actions/upload-artifact@v4
        with:
          name: bw-partial-ota-0x21
          path: nrf-epd-bw-partial-0x21-ota.zip
          if-no-files-found: error

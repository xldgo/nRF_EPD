name: Build HVX diagnostic firmware

on:
  push:
    branches:
      - diag/hvx-f455-0x21
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install ARM GCC 9.3.1
        run: |
          curl -fL --retry 3 \
            -o /tmp/gcc-arm-none-eabi.tar.bz2 \
            https://developer.arm.com/-/media/Files/downloads/gnu-rm/9-2020q2/gcc-arm-none-eabi-9-2020-q2-update-x86_64-linux.tar.bz2
          sudo tar -xjf /tmp/gcc-arm-none-eabi.tar.bz2 -C /usr/local
          /usr/local/gcc-arm-none-eabi-9-2020-q2-update/bin/arm-none-eabi-gcc --version

      - name: Build nRF52811 application
        run: make -f Makefile.nRF52 -j2

      - name: Show image size
        run: /usr/local/gcc-arm-none-eabi-9-2020-q2-update/bin/arm-none-eabi-size _build/nrf52811_xxaa.out

      - name: Upload application HEX
        uses: actions/upload-artifact@v4
        with:
          name: hvx-diagnostic-nrf52811
          path: _build/nrf52811_xxaa.hex
          if-no-files-found: error

name: Build HVX diagnostic firmware

on:
  push:
    branches:
      - diag/hvx-f455-0x21
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install ARM GCC 9.3.1
        run: |
          curl -fL --retry 3 \
            -o /tmp/gcc-arm-none-eabi.tar.bz2 \
            https://developer.arm.com/-/media/Files/downloads/gnu-rm/9-2020q2/gcc-arm-none-eabi-9-2020-q2-update-x86_64-linux.tar.bz2
          sudo tar -xjf /tmp/gcc-arm-none-eabi.tar.bz2 -C /usr/local
          /usr/local/gcc-arm-none-eabi-9-2020q2-update/bin/arm-none-eabi-gcc --version

      - name: Build nRF52811 application
        run: make -f Makefile.nRF52 -j2

      - name: Generate size analysis
        run: |
          TOOL=/usr/local/gcc-arm-none-eabi-9-2020q2-update/bin
          ELF=_build/nrf52811_xxaa.out
          $TOOL/arm-none-eabi-size "$ELF" | tee size-summary.txt
          $TOOL/arm-none-eabi-size -A "$ELF" > size-sections.txt
          $TOOL/arm-none-eabi-nm -S --size-sort --radix=d -l "$ELF" > size-symbols.txt
          $TOOL/arm-none-eabi-objdump -d -C "$ELF" > disasm.txt
          awk '
            /^[0-9a-f]+ <.*>:/ { fn=$0 }
            /bl.*<(__aeabi_dmul|__muldf3|__aeabi_dadd|__adddf3|__aeabi_dsub|__subdf3|__udivmoddi4|vsnprintf|_vsnprintf_r|_svfprintf_r|_svfiprintf_r)>/ {
              print fn; print "  " $0
            }
          ' disasm.txt > runtime-callers.txt
          echo 'Runtime-heavy callers:'
          cat runtime-callers.txt
          echo 'Largest symbols:'
          tail -n 100 size-symbols.txt

      - name: Upload application and size reports
        uses: actions/upload-artifact@v4
        with:
          name: hvx-diagnostic-build
          path: |
            _build/nrf52811_xxaa.hex
            _build/nrf52811_xxaa.out
            size-summary.txt
            size-sections.txt
            size-symbols.txt
            runtime-callers.txt
          if-no-files-found: error

  package-ota:
    needs: build
    runs-on: windows-2025
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download application build
        uses: actions/download-artifact@v4
        with:
          name: hvx-diagnostic-build
          path: _ci_build

      - name: Build signed Secure DFU package
        shell: pwsh
        run: |
          $nrfutil = Resolve-Path .\tools\bin\nrfutil.exe
          $hex = Resolve-Path .\_ci_build\_build\nrf52811_xxaa.hex
          $key = Resolve-Path .\tools\priv.pem
          & $nrfutil pkg generate `
            --application $hex `
            --key-file $key `
            --hw-version 52 `
            --sd-req 0x126 `
            --sd-id 0x126 `
            --application-version 0x21 `
            .\nrf-epd-hvx-diag-0x21-ota.zip
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Get-Item .\nrf-epd-hvx-diag-0x21-ota.zip | Format-List Name,Length

      - name: Upload signed BLE DFU ZIP
        uses: actions/upload-artifact@v4
        with:
          name: hvx-diagnostic-ota-0x21
          path: nrf-epd-hvx-diag-0x21-ota.zip
          if-no-files-found: error

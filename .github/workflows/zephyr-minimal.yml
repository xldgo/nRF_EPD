name: Build Zephyr minimal draw

on:
  push:
    branches:
      - zephyr/ncs-3.4-minimal-draw
    paths:
      - zephyr_minimal/**
      - .github/workflows/zephyr-minimal.yml
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    container:
      image: ghcr.io/nrfconnect/sdk-nrf-toolchain:v3.4.0
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout application
        uses: actions/checkout@v4

      - name: Initialize nRF Connect SDK v3.4.0
        run: |
          west init -m https://github.com/nrfconnect/sdk-nrf --mr v3.4.0 /tmp/ncs
          cd /tmp/ncs
          west update --narrow -o=--depth=1
          west zephyr-export

      - name: Build nRF52811 minimal draw image
        run: |
          cd /tmp/ncs
          west build -p always \
            -b nrf52840dk/nrf52811 \
            "$GITHUB_WORKSPACE/zephyr_minimal" \
            -d "$GITHUB_WORKSPACE/build-zephyr"

      - name: Show ROM and RAM reports
        run: |
          cd /tmp/ncs
          west build -d "$GITHUB_WORKSPACE/build-zephyr/zephyr_minimal" -t rom_report
          west build -d "$GITHUB_WORKSPACE/build-zephyr/zephyr_minimal" -t ram_report

      - name: Show application image size
        run: |
          set -euo pipefail
          image_dir="$GITHUB_WORKSPACE/build-zephyr/zephyr_minimal/zephyr"
          arm-zephyr-eabi-size "$image_dir/zephyr.elf"
          wc -c "$image_dir/zephyr.bin"
          echo "No fixed flash-size threshold is enforced here."
          echo "The OTA gate will be based on the legacy Nordic Secure DFU layout once the Zephyr image is linked for that layout."

      - name: Upload Zephyr image
        uses: actions/upload-artifact@v4
        with:
          name: zephyr-nrf52811-minimal-draw
          path: |
            build-zephyr/zephyr_minimal/zephyr/zephyr.hex
            build-zephyr/zephyr_minimal/zephyr/zephyr.bin
            build-zephyr/zephyr_minimal/zephyr/zephyr.elf
            build-zephyr/zephyr_minimal/zephyr/zephyr.map
          if-no-files-found: error

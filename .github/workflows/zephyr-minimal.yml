name: Build Zephyr minimal draw

on:
  push:
    branches:
      - zephyr/ncs-3.4-minimal-draw
    paths:
      - zephyr_minimal/**
      - .github/workflows/zephyr-minimal.yml
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    container:
      image: ghcr.io/nrfconnect/sdk-nrf-toolchain:v3.4.0
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout application
        uses: actions/checkout@v4

      - name: Initialize nRF Connect SDK v3.4.0
        run: |
          west init -m https://github.com/nrfconnect/sdk-nrf --mr v3.4.0 /tmp/ncs
          cd /tmp/ncs
          west update --narrow -o=--depth=1
          west zephyr-export

      - name: Build nRF52811 minimal draw image
        run: |
          cd /tmp/ncs
          west build -p always \
            -b nrf52840dk/nrf52811 \
            "$GITHUB_WORKSPACE/zephyr_minimal" \
            -d "$GITHUB_WORKSPACE/build-zephyr"

      - name: Show ROM and RAM reports
        run: |
          cd /tmp/ncs
          west build -d "$GITHUB_WORKSPACE/build-zephyr" -t rom_report
          west build -d "$GITHUB_WORKSPACE/build-zephyr" -t ram_report

      - name: Check 55 KiB application budget
        run: |
          set -euo pipefail
          line="$(arm-zephyr-eabi-size "$GITHUB_WORKSPACE/build-zephyr/zephyr/zephyr.elf" | tail -n 1)"
          text="$(awk '{print $1}' <<<"$line")"
          data="$(awk '{print $2}' <<<"$line")"
          flash=$((text + data))
          echo "application flash (text+data): ${flash} bytes"
          test "$flash" -le 56320

      - name: Upload Zephyr image
        uses: actions/upload-artifact@v4
        with:
          name: zephyr-nrf52811-minimal-draw
          path: |
            build-zephyr/zephyr/zephyr.hex
            build-zephyr/zephyr/zephyr.bin
            build-zephyr/zephyr/zephyr.elf
            build-zephyr/zephyr/zephyr.map
          if-no-files-found: error
